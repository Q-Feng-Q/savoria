server:
  port: ${PORT:8080}

spring:
  mail:
    host: smtp.qq.com
    port: 587
    username: ""
    password: ""
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  application:
    name: family-kitchen-backend
  datasource:
    url: jdbc:mysql://${MYSQL_ADDRESS:127.0.0.1:3306}/${MYSQL_DATABASE:family_kitchen}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.familykitchen
  configuration:
    map-underscore-to-camel-case: true

family-kitchen:
  migration:
    mode: ${FAMILY_KITCHEN_MIGRATION_MODE:OFF}
    batch-id: ${FAMILY_KITCHEN_MIGRATION_BATCH_ID:#{null}}
    drain-epoch: ${FAMILY_KITCHEN_MIGRATION_DRAIN_EPOCH:#{null}}
    expected-database: ${FAMILY_KITCHEN_MIGRATION_EXPECTED_DATABASE:}
    safety-token: ${FAMILY_KITCHEN_MIGRATION_SAFETY_TOKEN:}
    configured-token: ${FAMILY_KITCHEN_MIGRATION_CONFIGURED_TOKEN:}
  instance:
    lease-enabled: ${FAMILY_KITCHEN_INSTANCE_LEASE_ENABLED:false}
    id: ${FAMILY_KITCHEN_INSTANCE_ID:${random.uuid}}
    build: ${FAMILY_KITCHEN_INSTANCE_BUILD:unknown}
    heartbeat-ms: ${FAMILY_KITCHEN_INSTANCE_HEARTBEAT_MS:10000}
  file-storage:
    local-root: ${FAMILY_KITCHEN_FILE_STORAGE_LOCAL_ROOT:./uploads}
  feedback:
    private-root: ${FAMILY_KITCHEN_FEEDBACK_PRIVATE_ROOT:./data/feedback-private}
  dish-template-assets:
    private-root: ${FAMILY_KITCHEN_DISH_TEMPLATE_ASSETS_PRIVATE_ROOT:./data/dish-template-assets/private}
    public-root: ${FAMILY_KITCHEN_DISH_TEMPLATE_ASSETS_PUBLIC_ROOT:./uploads/dish-template-assets}
    public-url-prefix: /uploads/dish-template-assets
  jwt:
    secret: ${FAMILY_KITCHEN_JWT_SECRET:}
    expires-in-seconds: 7200
  auth:
    bootstrap-admin:
      username: admin
      display-name: 系统管理员
      password: ${FAMILY_KITCHEN_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
  wechat:
    app-id: "${FAMILY_KITCHEN_WECHAT_APP_ID:}"
    app-secret: "${FAMILY_KITCHEN_WECHAT_APP_SECRET:}"
